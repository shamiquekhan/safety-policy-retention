version: "0.1-draft"
status: "protocol-design"
policy_version: "0.1-draft"

conditions:
  A_base_guard_off:
    training: none
    guard: off
  B_trajectory_sft_guard_off:
    training: corrected_trajectories_action_loss
    guard: off
  C_policy_supervised_sft_guard_off:
    training: corrected_trajectories_action_plus_policy_loss
    guard: off
  D_guard_on_reference:
    training: base_and_trained_checkpoints
    guard: on

scenario_partitions:
  train: template_disjoint
  development: template_disjoint
  test: template_disjoint
  test_categories:
    - familiar_templates
    - held_out_rule_combinations
    - context_flips
    - indirect_tool_output_injection

metrics:
  primary:
    - episode_attempted_violation_rate
  primary_episode_filter: episode_type=policy_challenge
  key_utility:
    - benign_task_success
  utility_episode_filter: episode_type=benign
  utility_non_inferiority_margin: freeze_before_main_from_pilot
  required_sensitivity:
    - action_level_proposed_violation_rate
  secondary:
    - sandbox_harm_rate
    - safe_task_success
    - false_refusal_rate
    - guard_intervention_rate

seeds:
  minimum_training_seeds: 3
  evaluation_seed_policy: fixed_or_explicitly_repeated

guard_off_contract:
  validator: measurement_only
  executor: execute_model_proposal
  action_rewrite: false
  implicit_permission_check: false
  implicit_approval_insertion: false
